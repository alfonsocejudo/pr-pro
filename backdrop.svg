<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768">
  <!--
    Backdrop for this workflow's dashboard scene. Edit freely: the scene
    is 1376x768 and machines stand on the platform band, with y=440 as
    their ground line. The dashboard renders this file as an image, so
    scripts never run and references to other files don't load - keep
    everything inline.
  -->
  <defs>
    <linearGradient id="backdrop-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0a1626"/>
      <stop offset="1" stop-color="#060b15"/>
    </linearGradient>
    <radialGradient id="backdrop-floor-glow" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#1b3a56" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#060b15" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="backdrop-platform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a3d"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <pattern id="backdrop-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1a2c44" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1376" height="768" fill="url(#backdrop-bg)"/>
  <rect width="1376" height="768" fill="url(#backdrop-grid)"/>
  <rect x="0" y="160" width="1376" height="608" fill="url(#backdrop-floor-glow)"/>

  <g opacity="0.9">
    <rect x="0" y="440" width="1376" height="44" fill="url(#backdrop-platform)" stroke="#2a4968" stroke-width="1"/>
    <line x1="0" y1="440" x2="1376" y2="440" stroke="#81ecff" stroke-width="1" opacity="0.35"/>
    <line x1="0" y1="484" x2="1376" y2="484" stroke="#3aa8d6" stroke-width="0.5" opacity="0.25"/>
  </g>

  <line x1="0" y1="220" x2="1376" y2="220" stroke="#1b3550" stroke-width="1" opacity="0.5"/>
</svg>
